<!doctype html>
<html lang="en" data-theme="charcoal-orange">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0d10">
  <title>Admin Login | Usman Khan</title>
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-login-page">
  <div class="admin-ambient" aria-hidden="true"><span></span><span></span></div>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <a class="admin-brand" href="/index.html" aria-label="Back to Usman Khan website">
        <span class="admin-logo" id="admin-logo"></span>
      </a>
      <div class="login-heading">
        <p class="admin-eyebrow">Protected Admin Panel</p>
        <h1 id="login-title">Welcome back.</h1>
        <p>Sign in to manage website content, images, contact details and themes.</p>
      </div>
      <form id="admin-login-form" class="login-form">
        <label>Username
          <input name="username" type="text" autocomplete="username" required autofocus>
        </label>
        <label>Password
          <span class="password-field">
            <input name="password" type="password" autocomplete="current-password" required>
            <button type="button" id="toggle-password" aria-label="Show password">Show</button>
          </span>
        </label>
        <p class="login-notice" id="login-notice" role="status"></p>
        <p class="login-error" id="login-error" role="alert"></p>
        <button class="admin-button admin-button--primary admin-button--full" type="submit" id="login-button">Sign In Securely</button>
      </form>
      <a class="back-link" href="/index.html">← Return to the public website</a>
    </section>
  </main>
  <script src="/assets/js/admin-login.js" defer></script>
</body>
</html>
