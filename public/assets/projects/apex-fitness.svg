      <text x="80" y="450" fill="#aaa9a5" font-size="17">Expert coaching. Focused programmes.</text>
      <text x="80" y="476" fill="#aaa9a5" font-size="17">A community that keeps you moving.</text>
      <rect x="80" y="517" width="174" height="55" rx="8" fill="url(#orange)"/>
      <text x="167" y="551" text-anchor="middle" fill="#211007" font-size="13" font-weight="800">START TRAINING</text>
