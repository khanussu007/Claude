      <text x="80" y="685" fill="#838784" font-size="11" letter-spacing="2">FIND THE PROGRAMME THAT MOVES YOU</text>
      <rect x="80" y="709" width="319" height="55" rx="9" fill="#fff" opacity=".045"/>
      <rect x="415" y="709" width="319" height="55" rx="9" fill="#fff" opacity=".045"/>
      <rect x="750" y="709" width="368" height="55" rx="9" fill="#fff" opacity=".045"/>
      <text x="105" y="743" fill="#d0d0cb" font-size="13"><tspan fill="#ff8542">01</tspan><tspan dx="17">Personal coaching</tspan></text>
      <text x="440" y="743" fill="#d0d0cb" font-size="13"><tspan fill="#ff8542">02</tspan><tspan dx="17">Group training</tspan></text>
      <text x="775" y="743" fill="#d0d0cb" font-size="13"><tspan fill="#ff8542">03</tspan><tspan dx="17">Nutrition support</tspan></text>
