      <circle cx="912" cy="382" r="142" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="28"/>
      <path d="M912 240a142 142 0 0 1 137 104" fill="none" stroke="url(#orange)" stroke-width="28" stroke-linecap="round"/>
      <text x="912" y="378" text-anchor="middle" fill="#f8f6f2" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800">86%</text>
