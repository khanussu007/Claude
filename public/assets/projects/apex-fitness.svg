      <rect x="754" y="505" width="364" height="93" rx="16" fill="#1c1e20" stroke="#fff" stroke-opacity=".09"/>
      <circle cx="794" cy="551" r="24" fill="#ff762e" opacity=".13"/>
      <path d="M781 551h26m-22-8v16m18-16v16m-25-12v8m32-8v8" stroke="#ff9254" stroke-width="4" stroke-linecap="round"/>
      <text x="834" y="545" fill="#f0efec" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">Strength &amp; Conditioning</text>
      <text x="834" y="569" fill="#8f9292" font-family="Arial,Helvetica,sans-serif" font-size="11">Next session · 6:30 PM</text>
      <circle cx="1080" cy="551" r="16" fill="#ff762e"/><path d="m1075 551 4 4 7-9" fill="none" stroke="#1d1008" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g font-family="Arial,Helvetica,sans-serif">
