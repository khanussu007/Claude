<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Apex Fitness concept website</title>
  <desc id="desc">A bold fitness landing page concept with training programme cards and energetic orange accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20201f"/><stop offset="1" stop-color="#0d0f11"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffad4d"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ff7433" stop-opacity=".42"/><stop offset="1" stop-color="#ff7433" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity=".4"/></filter>
    <clipPath id="screen"><rect x="10" y="10" width="1180" height="780" rx="28"/></clipPath>
  </defs>
  <rect width="1200" height="800" fill="#08090a"/>
